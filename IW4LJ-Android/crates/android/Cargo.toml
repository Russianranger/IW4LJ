[package]
name = "iw4l-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Android entry: the cdylib Android loads, assembling the runtime for a device."

[lib]
name = "iw4l_android"
crate-type = ["cdylib"]

[dependencies]
bootstrap = { path = "../bootstrap" }
touch = { path = "../touch" }
lan = { path = "../lan" }
updater = { path = "../updater" }
asset_transport.workspace = true
jni = "0.22"
ndk-context = "0.1"
diag.workspace = true
sim.workspace = true
bevy.workspace = true
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

[features]
# Development only: record large live allocations by call site (see
# `src/heap_probe.rs`).
heap-probe = []

[lints]
workspace = true

# The Android entry activities and controller bridge require DEX. Build the APK
# with package-linux.sh or package.ps1 alongside this manifest.
